[package]
name = "ccguard"
version = "0.1.0"
edition = "2021"
# Not published; this crate exists only to produce the committed hook binary.
publish = false

[dependencies]
# These hooks read a JSON payload on stdin whose string fields carry arbitrary
# shell commands and script source — hand-rolling a JSON parser for that is a
# correctness risk with no upside. Output JSON is emitted by hand (see
# hook::emit_permission_decision) to pin key order byte-for-byte against the JS
# implementation, so only the parse half is used.
serde_json = "1"

# `regex-lite`, NOT `regex`. The full crate's Unicode tables and DFA add ~1.5MB
# to a binary that is committed to a repo whose entire history is 18MB;
# regex-lite is ~1/10th that and these patterns run once, on one short string,
# against no adversarial input. Neither crate supports lookaround (both are
# finite-automata engines, same constraint as RE2) — see design_gate.rs for how
# the JS original's two negative lookaheads were removed without changing what
# they match.
#
# Divergence from JS to keep in mind: regex-lite's `\w`/`\s`/`\b` and its
# case-insensitive folding are ASCII-only, while JS `\s` is not.
#
# This was once recorded here as accepted-and-unreachable, on the grounds that
# exotic Unicode whitespace only ever appears inside a quoted token the tokenizer
# has already consumed. That holds for design_gate.rs, which tokenizes before
# matching. It does NOT hold for workflow_model.rs, which matches raw script
# text — and that guard was silently allowing fan-out scripts whose `agent (`
# calls were separated by U+00A0. Patterns there now spell the JS `\s` set out
# explicitly (see `JS_WS`); `\w` and `\b` remain ASCII-only, which is faithful
# because JS `\w`/`\b` are ASCII-only too.
regex-lite = "0.1"

[profile.release]
# Size is the binding constraint — this binary is committed once per consuming
# plugin, on every change to the guards. Not speed: these are ~1ms of work.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# A panic aborts rather than unwinding. Claude Code treats a non-zero, non-2 exit
# from a PreToolUse hook as a non-blocking error, so an abort degrades to
# fail-open — the same behaviour the JS guards have when node is missing. The
# code is written not to panic regardless; this is the backstop, not the plan.
panic = "abort"
