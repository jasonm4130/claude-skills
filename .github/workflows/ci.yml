name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests parse
        run: |
          set -e
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            echo "Checking $f"
            jq -e . "$f" > /dev/null
          done

  node-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run all plugin node tests
        shell: bash
        run: bash scripts/run-node-tests.sh

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate every plugin with claude plugin validate
        # `claude plugin validate` needs no auth/login/network beyond installing the CLI
        # itself (verified with a from-scratch HOME) — the CLI route is viable. It must run
        # PER PLUGIN DIRECTORY, not once at the marketplace root: `claude plugin validate .`
        # only checks marketplace.json/plugin.json manifests and does NOT walk into each
        # plugin's skills/*/SKILL.md, so it silently misses the exact frontmatter defect
        # (unquoted YAML descriptions) this gate exists to catch — reproduced locally before
        # writing this job. Deliberately not --strict: that would also fail on the `engines`/
        # `contributors` unknown-field warnings several plugin.json manifests carry, which is
        # a separate, accepted informational warning (see README's Node.js note) — this gate
        # is scoped to catching a broken SKILL.md, not to zero-warning manifests.
        run: |
          set -e
          for p in plugins/*/; do
            echo "== validating $p =="
            claude plugin validate "$p"
          done

  bash-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run SDD bash helper smoke tests
        run: bash plugins/subagent-driven-development/scripts/scripts.test.sh

  go-guards:
    # macOS-only by design: the committed binary is a macOS universal build, and
    # `macos-latest` is the one runner where scripts/ccguard-differential.test.mjs
    # actually executes rather than skips. Go itself cross-compiles fine — it is the
    # artifact under test that is macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go/go.mod
      - name: Vet and unit tests
        run: |
          cd go
          go vet ./...
          go test ./...
      - name: Committed binary was built from the committed source
        # The binary is a build artifact living in git because the marketplace has
        # no build step. That only stays honest if CI proves the committed binary
        # came from the committed source.
        #
        # The Rust predecessor could not compare bytes — Rust builds are not
        # bit-reproducible across toolchain versions or build paths — so it compared
        # a source fingerprint baked in by build.rs. Go with `-trimpath` IS
        # reproducible, so we rebuild and compare the real artifact. Strictly
        # stronger: it catches both a stale binary and one built from other source.
        shell: bash
        run: |
          set -euo pipefail
          cd go
          GOOS=darwin GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -trimpath -o /tmp/fresh-arm64 .
          GOOS=darwin GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -trimpath -o /tmp/fresh-amd64 .
          lipo -create -output /tmp/fresh-universal /tmp/fresh-arm64 /tmp/fresh-amd64
          cd ..
          if ! cmp -s /tmp/fresh-universal plugins/gates/bin/ccguard; then
            echo "::error::plugins/gates/bin/ccguard does not match a fresh build of go/ — rebuild and re-copy (see go/README.md)"
            exit 1
          fi
          echo "the committed binary matches the committed source"
      - name: Differential test against the .mjs reference
        run: node --test scripts/ccguard-differential.test.mjs

  version-bump-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every changed plugin bumped its version
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PRs compare against the PR base; direct pushes to main are a backstop
          # (branch protection makes them rare) and compare against the prior tip.
          if [ -n "${PR_BASE:-}" ]; then
            BASE="$PR_BASE"
          else
            BASE="${PUSH_BEFORE:-}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref (new branch / initial push) — nothing to diff."
            exit 0
          fi
          node scripts/check-version-bumps.mjs "$BASE"
